[package]
name = "flashlane-core"
version = "2.0.0"
description = "High-performance native raw-device block I/O flasher and PXE boot server"
authors = ["RitualDev Lab <security@ritualdev.in>"]
edition = "2021"
license = "MIT"

[lib]
name = "flashlane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.30"
anyhow = "1.0"
tracing = "0.1"
tempfile = "3.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
